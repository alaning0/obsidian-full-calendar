name: docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml

permissions:
  contents: write

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: |
          pip install mkdocs-material
          mkdocs gh-deploy --force
