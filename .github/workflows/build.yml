name: CI Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Ensure required artifacts exist
        run: |
          test -f main.js
          test -f manifest.json
          if [ -f main.css ]; then mv main.css styles.css; fi
          test -f styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-full-calendar-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
