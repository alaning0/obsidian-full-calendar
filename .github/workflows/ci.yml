name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run compile

      - name: Run tests
        run: npm run test

      - name: Build plugin
        run: npm run build

      - name: Verify required artifacts exist
        run: |
          test -f main.js
          test -f manifest.json
          # esbuild emits main.css from CSS imports; Obsidian expects styles.css
          if [ -f main.css ]; then mv main.css styles.css; fi
          test -f styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-full-calendar-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
