# Release workflow: builds and publishes the Obsidian plugin to GitHub Releases.
#
# Preferred release flow:
#   1. Bump version in package.json and manifest.json (npm version patch/minor/major)
#   2. Commit and push to main
#   3. Push a tag matching the manifest version (e.g. git tag 0.13 && git push origin 0.13)
#   4. This workflow runs CI, verifies version==tag, and creates the GitHub Release
#
# softprops/action-gh-release is the single publisher; do not add alternative paths.

name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PLUGIN_NAME: obsidian-full-calendar

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish Release
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG="${{ github.ref_name }}"
          if [ "$MANIFEST_VERSION" != "$TAG" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "Version check passed: $MANIFEST_VERSION == $TAG"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: obsidian-full-calendar-build

      - name: Package plugin
        run: |
          mkdir "${{ env.PLUGIN_NAME }}"
          cp main.js manifest.json styles.css "${{ env.PLUGIN_NAME }}/"
          zip -r "${{ env.PLUGIN_NAME }}.zip" "${{ env.PLUGIN_NAME }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
