name: Check

on:
    push:
        branches:
            - "**"
        tags-ignore:
            - "**"
    pull_request:

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: npm
            - run: npm ci --legacy-peer-deps
            - run: npm run lint
            - run: npm run compile

    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: npm
            - run: npm ci --legacy-peer-deps
            - run: npm run test
